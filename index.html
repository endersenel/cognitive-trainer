<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>SPPLab - Performance Studio</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: #151515; padding: 6px 10px; text-align: center; border-bottom: 1px solid #333; flex-shrink: 0; }
        h1 { margin: 0 0 6px 0; font-size: clamp(0.85rem, 3vw, 1.1rem); color: #00e5ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .demo-bar { display: flex; gap: 4px; justify-content: center; align-items: center; width: 100%; flex-wrap: wrap; margin-bottom: 6px; }
        .demo-field { display: flex; flex-direction: column; align-items: flex-start; }
        .demo-field label { font-size: 0.6rem; color: #00e5ff; margin-bottom: 1px; font-weight: bold; }
        .demo-field input, .demo-field select { background: #222; color: #fff; border: 1px solid #00e5ff; padding: 4px 5px; border-radius: 4px; font-size: clamp(0.65rem, 2vw, 0.75rem); outline: none; }
        
        .panel-row { display: flex; gap: 6px; justify-content: center; align-items: center; width: 100%; }
        #module-select { background: #222; color: #fff; border: 1px solid #00e5ff; padding: 6px 8px; border-radius: 6px; font-size: clamp(0.7rem, 2.5vw, 0.85rem); outline: none; width: 100%; max-width: 450px; text-overflow: ellipsis; }
        
        #color-picker-bar { display: none; background: #111; padding: 4px 8px; border-bottom: 1px solid #333; text-align: center; font-size: clamp(0.65rem, 2vw, 0.75rem); max-height: 20vh; overflow-y: auto; flex-shrink: 0; }
        .color-checkbox { margin: 2px 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }

        #stats-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 6px 12px; font-size: clamp(0.65rem, 2.2vw, 0.8rem); font-weight: bold; border-bottom: 1px solid #333; flex-shrink: 0; }
        .stat-item { text-align: center; }
        .stat-item span { color: #00e676; display: inline-block; }

        #game-area { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; background: #0e0e0e; display: flex; justify-content: center; align-items: center; padding: 10px; }

        #instruction-card { position: absolute; width: min(92%, 480px); max-height: 85%; overflow-y: auto; background: rgba(20,20,20,0.95); border: 2px solid #00e5ff; padding: 16px; border-radius: 12px; text-align: left; z-index: 100; box-shadow: 0 0 20px rgba(0,229,255,0.2); }
        #instruction-card h3 { margin-top: 0; color: #00e5ff; font-size: clamp(0.95rem, 3.5vw, 1.2rem); text-align: center; }
        #instruction-card p { font-size: clamp(0.72rem, 2.6vw, 0.85rem); line-height: 1.4; color: #ddd; margin-bottom: 6px; }
        .eval-info { background: #181818; border-left: 3px solid #00e5ff; padding: 6px 8px; font-size: 0.72rem; color: #bbb; margin-top: 6px; border-radius: 0 4px 4px 0; }
        .score-info { background: #111; border-left: 3px solid #00e676; padding: 6px 8px; font-size: 0.72rem; color: #aaa; margin-top: 6px; border-radius: 0 4px 4px 0; }

        #antisaccade-touch-zone { display: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 5; }
        .antisaccade-half { position: absolute; width: 50%; height: 100%; top: 0; cursor: pointer; }
        #antisaccade-left-zone { left: 0; border-right: 1px dashed rgba(255,255,255,0.1); }
        #antisaccade-right-zone { right: 0; }

        #dual-buttons { display: none; width: 100%; max-width: 400px; gap: 20px; justify-content: center; z-index: 10; position: absolute; bottom: 15px; }
        .choice-btn { flex: 1; padding: 16px 0; font-size: 1rem; font-weight: bold; border-radius: 10px; border: 2px solid #fff; cursor: pointer; text-align: center; color: #fff; }
        .btn-left { background: #ff1744; }
        .btn-right { background: #29b6f6; }

        #target-circle { position: absolute; width: clamp(100px, 25vw, 140px); height: clamp(100px, 25vw, 140px); border-radius: 50%; background: #000; border: 3px solid #fff; display: none; justify-content: center; align-items: center; font-size: clamp(1.2rem, 4vw, 1.8rem); font-weight: 900; box-shadow: 0 0 25px rgba(255,255,255,0.4); text-align: center; padding: 8px; cursor: pointer; z-index: 20; }

        #spatial-grid { display: none; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; width: 100%; height: 100%; max-width: 500px; max-height: 500px; margin: auto; }
        .spatial-btn { border-radius: 12px; opacity: 0.3; transition: opacity 0.1s; display: flex; justify-content: center; align-items: center; font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 900; color: #000; cursor: pointer; border: 2px solid #fff; width: 100%; height: 100%; }
        .spatial-btn.active { opacity: 1; box-shadow: 0 0 35px #fff; transform: scale(0.98); }

        #memory-grid { display: none; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; width: min(70vw, 70vh, 280px); height: min(70vw, 70vh, 280px); margin: auto; }
        .memory-block { background: #222; border: 2px solid #00e5ff; border-radius: 8px; cursor: pointer; width: 100%; height: 100%; }
        .memory-block.lit { background: #00e5ff !important; box-shadow: 0 0 25px #00e5ff !important; }

        #numpad-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(75vw, 260px); margin: auto; }
        .num-btn { background: #222; border: 1px solid #00e5ff; color: #fff; font-size: 1.2rem; font-weight: bold; padding: 12px 0; border-radius: 6px; text-align: center; cursor: pointer; }
        .num-btn:active { background: #00e5ff; color: #000; }

        #trail-area { display: none; position: relative; width: 100%; height: 100%; }
        .trail-node { position: absolute; width: clamp(38px, 9vw, 46px); height: clamp(38px, 9vw, 46px); border-radius: 50%; background: #00e5ff; color: #000; font-weight: 900; font-size: clamp(0.85rem, 2.5vw, 1.1rem); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(0,0,0,0.5); cursor: pointer; border: 2px solid #fff; }

        #controls { padding: 8px 12px; background: #151515; display: flex; gap: 8px; justify-content: center; flex-shrink: 0; border-top: 1px solid #333; width: 100%; }
        button { flex: 1; max-width: 140px; min-height: 44px; padding: 10px 0; font-size: clamp(0.75rem, 2.5vw, 0.9rem); font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-start { background: #00c853; color: white; }
        .btn-stop { background: #d50000; color: white; }
        .btn-export { background: #0288d1; color: white; }
        button:disabled { background: #333 !important; color: #666 !important; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>SPPLab - Performance Studio</h1>
        
        <div class="demo-bar">
            <div class="demo-field">
                <label>Sporcu ID</label>
                <input type="text" id="athlete-id" value="SP-101" style="width: 75px;">
            </div>
            <div class="demo-field">
                <label>Yaş</label>
                <input type="number" id="athlete-age" value="22" style="width: 45px;">
            </div>
            <div class="demo-field">
                <label>Cinsiyet</label>
                <select id="athlete-gender" style="width: 65px;">
                    <option value="Erkek">Erkek</option>
                    <option value="Kadin">Kadın</option>
                </select>
            </div>
            <div class="demo-field">
                <label>Branş</label>
                <input type="text" id="athlete-sport" value="Futbol" style="width: 70px;">
            </div>
            <div class="demo-field">
                <label>Baskın El/Ayak</label>
                <select id="athlete-dominant" style="width: 55px;">
                    <option value="Sag">Sağ</option>
                    <option value="Sol">Sol</option>
                </select>
            </div>
            <div class="demo-field">
                <label>Spor Yılı</label>
                <input type="number" id="athlete-exp" value="5" style="width: 55px;">
            </div>
        </div>

        <div class="panel-row">
            <select id="module-select">
                <optgroup label="A. Bilişsel İnhibisyon & Çatışma">
                    <option value="gonogo">1. Go/No-Go (Baskılama)</option>
                    <option value="stroop">2. Stroop (Renk-Kelime Çelişkisi)</option>
                    <option value="simon">3. Simon Effect (Mekânsal Çatışma)</option>
                    <option value="flanker">4. Flanker Testi (Çeldirici Dikkat)</option>
                    <option value="antisaccade">5. Anti-Saccade (Refleks Baskılama)</option>
                </optgroup>
                <optgroup label="B. Nöropsikolojik & Bellek">
                    <option value="trailA">6. Trail Making A (1-20 Sayı)</option>
                    <option value="trailB">7. Trail Making B (1-A-2-B...)</option>
                    <option value="memory">8. Görsel Dizilim Bellek (Corsi)</option>
                    <option value="nback">9. Spatial N-Back Bellek</option>
                    <option value="digit_span">10. Görsel Sayı Dizilimi Belleği</option>
                </optgroup>
                <optgroup label="C. Saha & Kinetik Depar">
                    <option value="sprint_ball">11. Saha Depar: Top Getirme (10 Deneme)</option>
                    <option value="agility_run">12. Renk Koni Çeviklik Deparı</option>
                    <option value="complex_agility">13. Karmaşık Çift Komut Deparı (Go/No-Go)</option>
                    <option value="choice_react">14. Çoklu Seçenek Reaksiyon Deparı</option>
                    <option value="visual_search">15. Görsel Arama & Depar</option>
                </optgroup>
            </select>
        </div>
    </header>

    <div id="color-picker-bar">
        <span style="color:#00e5ff; font-weight:bold;">Saha Renkleri (En az 4 seçin):</span><br>
        <label class="color-checkbox"><input type="checkbox" value="RED" checked> Red</label>
        <label class="color-checkbox"><input type="checkbox" value="BLUE" checked> Blue</label>
        <label class="color-checkbox"><input type="checkbox" value="GREEN" checked> Green</label>
        <label class="color-checkbox"><input type="checkbox" value="YELLOW" checked> Yellow</label>
        <label class="color-checkbox"><input type="checkbox" value="WHITE"> White</label>
        <label class="color-checkbox"><input type="checkbox" value="BLACK"> Black</label>
        <label class="color-checkbox"><input type="checkbox" value="ORANGE"> Orange</label>
        <label class="color-checkbox"><input type="checkbox" value="PURPLE"> Purple</label>
        <label class="color-checkbox"><input type="checkbox" value="PINK"> Pink</label>
        <label class="color-checkbox"><input type="checkbox" value="BROWN"> Brown</label>
    </div>

    <div id="stats-bar">
        <div class="stat-item">Deneme: <span id="stat-trials">0/10</span></div>
        <div class="stat-item">Sayaç: <span id="stat-timer">0.00 s</span></div>
        <div class="stat-item">Son RT: <span id="stat-last-rt">0 ms</span></div>
        <div class="stat-item">Puan: <span id="stat-score">0</span></div>
        <div class="stat-item">Hata: <span id="stat-errors">0</span></div>
    </div>

    <div id="game-area">
        <div id="instruction-card">
            <h3 id="instr-title">Test Yönergesi</h3>
            <p id="instr-text">Test detayları yükleniyor...</p>
            <div id="instr-eval" class="eval-info">Değerlendirme Ölçütleri Yükleniyor...</div>
            <div id="instr-score-formula" class="score-info">Puanlama Formülü Yükleniyor...</div>
        </div>

        <div id="antisaccade-touch-zone">
            <div id="antisaccade-left-zone" class="antisaccade-half"></div>
            <div id="antisaccade-right-zone" class="antisaccade-half"></div>
        </div>

        <div id="target-circle"></div>

        <div id="dual-buttons">
            <div class="choice-btn btn-left" id="btn-left-opt">SOL</div>
            <div class="choice-btn btn-right" id="btn-right-opt">SAĞ</div>
        </div>

        <div id="spatial-grid">
            <div class="spatial-btn" id="s-red" style="background:#ff1744;">RED</div>
            <div class="spatial-btn" id="s-blue" style="background:#29b6f6;">BLUE</div>
            <div class="spatial-btn" id="s-green" style="background:#00e676;">GREEN</div>
            <div class="spatial-btn" id="s-yellow" style="background:#ffea00;">YELLOW</div>
        </div>

        <div id="memory-grid"></div>
        <div id="numpad-grid"></div>
        <div id="trail-area"></div>
    </div>

    <div id="controls">
        <button id="start-btn" class="btn-start">Başlat</button>
        <button id="stop-btn" class="btn-stop" disabled>Durdur</button>
        <button id="export-btn" class="btn-export" disabled>CSV İndir</button>
    </div>

    <script>
        const API_URL = "YOUR_GOOGLE_SCRIPT_WEB_APP_URL";

        const instructions = {
            gonogo: { 
                title: "1. Go/No-Go Testi", 
                text: "Yeşil 'DOKUN!' uyarısında (%70 olasılık) olabildiğince hızlı dokunun. Kırmızı 'DUR!' uyarısında (%30 olasılık) dokunmayarak motor tepkinizi baskılayın.", 
                eval: "Ölçülen Bilişsel Yetenek: Prefrontal Korteks Baskılama (Inhibition) & İmpuls Kontrolü.",
                scoreFormula: "Puan = (Doğru Go% * 50) + (Doğru NoGo% * 50) - (Ort. RT / 20)" 
            },
            stroop: { 
                title: "2. Stroop Testi", 
                text: "Kelimenin yazı rengi ile anlamı aynı olduğunda dokunun. Kelime ve renk çeliştiğinde dokunmayarak kendinizi frenleyin.", 
                eval: "Ölçülen Bilişsel Yetenek: Bilişsel Çatışma Yönetimi & Otomatik Yanıt Baskılama.",
                scoreFormula: "Puan = Doğru * 10 - (Ort. RT / 15) - (Hata * 15)" 
            },
            simon: { 
                title: "3. Simon Effect Testi", 
                text: "Dairenin ekrandaki konumuna aldanmayın. Kırmızı görünürse SOL, Mavi görünürse SAĞ butona basın.", 
                eval: "Ölçülen Bilişsel Yetenek: Mekânsal Çatışma ve Uyaran-Tepki Uyumluluğu.",
                scoreFormula: "Puan = 100 - (Gecikme ms * 0.2) - (Hata * 20)" 
            },
            flanker: { 
                title: "4. Flanker Testi", 
                text: "Yanlardaki çeldirici oklara bakmayın (<<><<). Sadece ortadaki 3. okun yönündeki butona dokunun.", 
                eval: "Ölçülen Bilişsel Yetenek: Seçici Görsel Dikkat & Odaklanma Kalitesi.",
                scoreFormula: "Puan = (Doğru % * 100) - (Gecikme / 10)" 
            },
            antisaccade: { 
                title: "5. Anti-Saccade Testi", 
                text: "Sarı ışık yandığında ışığa DOKUNMAYIN! Doğal refleksinizi baskılayarak ekranın TAM ZIT tarafındaki boş alana dokunun.", 
                eval: "Ölçülen Bilişsel Yetenek: Okülomotor Kontrol & Görsel Refleks İnhibisyonu.",
                scoreFormula: "Puan = (Başarılı Zıt Tepki * 20) - (Reaksiyon ms / 25)" 
            },
            trailA: { 
                title: "6. Trail Making Test A", 
                text: "1'den 20'ye kadar olan sayı dizilimini en hızlı şekilde sırayla birleştirin.", 
                eval: "Ölçülen Bilişsel Yetenek: Görsel Tarama Hızı ve Motor İşlem Hızı.",
                scoreFormula: "Puan = Max(0, 1000 - [Süre sn * 10 + Hata * 50])" 
            },
            trailB: { 
                title: "7. Trail Making Test B", 
                text: "1-A-2-B-3-C... şeklinde ardışık sayı ve harf dizilimini sırasıyla tamamlayın.", 
                eval: "Ölçülen Bilişsel Yetenek: Zihinsel Esneklik, Görev Değiştirme ve Çalışma Belleği.",
                scoreFormula: "Puan = Max(0, 1000 - [Süre sn * 10 + Hata * 50])" 
            },
            memory: { 
                title: "8. Görsel Dizilim Bellek (Corsi)", 
                text: "Mavi karelerin yanma sırasını takip edip aynı sırayla dokunun. 2 hatada test tamamlanır.", 
                eval: "Ölçülen Bilişsel Yetenek: Görsel-Uzamsal Çalışma Belleği Kapasitesi.",
                scoreFormula: "Puan = (Seviye * 100) + (Başarılı Blok * 10) - (Hata * 25)" 
            },
            nback: { 
                title: "9. Spatial N-Back Bellek", 
                text: "Yanan kare BİR ÖNCEKİ yanan kare ile AYNI konumdaysa 'EŞLEŞTİ (AYNI)' butonuna, farklıysa 'FARKLI' butonuna basın.", 
                eval: "Ölçülen Bilişsel Yetenek: Çalışma Belleği Güncelleme ve Sürekli Dikkat.",
                scoreFormula: "Puan = (Doğru % * 80) + (1000 / Ort. RT * 200)" 
            },
            digit_span: { 
                title: "10. Görsel Sayı Dizilimi Belleği", 
                text: "Ekranda sırayla gösterilen sayı dizisini aklınızda tutun. Gösterim bitince klavyeden sırayla girin.", 
                eval: "Ölçülen Bilişsel Yetenek: Kısa Süreli Dizi Belleği (Digit Span Forward).",
                scoreFormula: "Puan = (Dizi Uzunluğu * 150) - (Hata * 30)" 
            },
            sprint_ball: { 
                title: "11. Saha Depar (Top Getirme)", 
                text: "Sesli verilen İngilizce renk komutuna göre depar atıp nesneyi getirin ve ekrana dokunun (10 Deneme).", 
                eval: "Ölçülen Kinetik Yetenek: İşitsel Reaksiyon Hızı ve Patlayıcı İvmelenme.",
                scoreFormula: "Puan = Max(0, 100 - [Ort. Depar Süresi ms / 100])" 
            },
            agility_run: { 
                title: "12. Renk Koni Çeviklik Deparı", 
                text: "Aktif olan koniye depar atın ve dönüşte dokunarak süreyi durdurun.", 
                eval: "Ölçülen Kinetik Yetenek: Çevre Algısı ve Görsel Reaksiyon Çevikliği.",
                scoreFormula: "Puan = (Doğru % * 60) + Max(0, 40 - [Ort. Süre ms / 200])" 
            },
            complex_agility: { 
                title: "13. Karmaşık Çift Komut Deparı", 
                text: "Ses ve Ekran Rengi EŞLEŞTİĞİNDE depar atın. Çelişki varsa yerinizde sabit kalın!", 
                eval: "Ölçülen Kinetik Yetenek: Saha İçi Karar Verme ve Hızlı Motor İnhibisyon.",
                scoreFormula: "Puan = (Doğru Depar * 10) + (Doğru Frenleme * 15) - (Hatalı Depar * 20)" 
            },
            choice_react: { 
                title: "14. Çoklu Seçenek Reaksiyon Deparı", 
                text: "4 koni arasından belirtilen hedef renge en hızlı deparı atın.", 
                eval: "Ölçülen Kinetik Yetenek: Karmaşık Uyaran Seçimi ve Yönsel Motor Reaksiyon.",
                scoreFormula: "Puan = Max(0, 100 - [Reaksiyon ms / 50] - [Yanlış Yön * 15])" 
            },
            visual_search: { 
                title: "15. Görsel Arama & Depar", 
                text: "Karmaşık semboller arasından hedef renkli objeyi bulun ve o koniye depar atın.", 
                eval: "Ölçülen Kinetik Yetenek: Karmaşık Görsel Taraması ve Depar İvmelenmesi.",
                scoreFormula: "Puan = (1000 / Arama Depar Süresi ms * 500) - (Hata * 25)" 
            }
        };

        const colorMap = {
            RED: { hex: '#ff1744', soundFreq: 400 },
            BLUE: { hex: '#29b6f6', soundFreq: 500 },
            GREEN: { hex: '#00e676', soundFreq: 600 },
            YELLOW: { hex: '#ffea00', soundFreq: 700 },
            WHITE: { hex: '#ffffff', soundFreq: 800 },
            BLACK: { hex: '#555555', soundFreq: 300 },
            ORANGE: { hex: '#ff9100', soundFreq: 650 },
            PURPLE: { hex: '#d500f9', soundFreq: 750 },
            PINK: { hex: '#f50057', soundFreq: 850 },
            BROWN: { hex: '#8d6e63', soundFreq: 350 }
        };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(freq, type = 'sine', duration = 0.15) {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function speakEnglish(text) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'en-US';
                    msg.rate = 1.0;
                    window.speechSynthesis.speak(msg);
                }
            } catch (e) {}
        }

        let totalTrials = 10;
        let currentTrial = 0;
        let trialStartTime = 0;
        let testOverallStartTime = 0;
        let timerTimeout = null;
        let clockInterval = null;
        let isWaiting = false;
        let trialData = [];
        
        let currentCorrectAnswer = null;
        let trailStage = "DEMO1";
        let nextTrailIndex = 0;
        let trailSequence = [];

        let memorySequence = [];
        let playerMemorySequence = [];
        let memoryLevel = 3;
        let memoryConsecutiveErrors = 0;
        let lastNBackPos = null;

        const moduleSelect = document.getElementById('module-select');
        const colorPickerBar = document.getElementById('color-picker-bar');
        const gameArea = document.getElementById('game-area');
        const targetCircle = document.getElementById('target-circle');
        const antisaccadeTouchZone = document.getElementById('antisaccade-touch-zone');
        const antisaccadeLeftZone = document.getElementById('antisaccade-left-zone');
        const antisaccadeRightZone = document.getElementById('antisaccade-right-zone');
        const dualButtons = document.getElementById('dual-buttons');
        const btnLeftOpt = document.getElementById('btn-left-opt');
        const btnRightOpt = document.getElementById('btn-right-opt');
        const spatialGrid = document.getElementById('spatial-grid');
        const memoryGrid = document.getElementById('memory-grid');
        const numpadGrid = document.getElementById('numpad-grid');
        const trailArea = document.getElementById('trail-area');
        const instructionCard = document.getElementById('instruction-card');
        const instrTitle = document.getElementById('instr-title');
        const instrText = document.getElementById('instr-text');
